<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" id="avatar" data-contract="1" data-blink="off">
  <!-- Hybrid avatar: art/ja-yuki.png (illustration, built to /avatars/ja-yuki-art.webp by scripts/avatar-art.mjs)
       plus vector eyes, brows, cheeks and mouths so they can animate. Image is drawn 560x560 at (-24,-6) so tilting never shows an edge. -->
  <g id="rig" data-pivot="256 500">
    <ellipse id="shadow" cx="256" cy="506" rx="110" ry="8" fill="#1C1B2E" fill-opacity="0.12"/>
    <g id="body" data-pivot="256 500"></g>
    <g id="head" data-pivot="256 440">
      <g id="head_base"><image href="/avatars/ja-yuki-art.webp" x="-24" y="-6" width="560" height="560"/></g>
      <g id="cheeks"><ellipse cx="199" cy="244" rx="14" ry="7" fill="#F4929A" fill-opacity="0.15"/><ellipse cx="313" cy="241" rx="14" ry="7" fill="#F4929A" fill-opacity="0.15"/></g>
      <!-- The illustration's own eyes, brows and mouth are the resting look. Eyes blink by a skin-coloured lid sliding over them
           (pupil/white are tiny stand-ins the controller can nudge); the mouth patch hides the painted mouth so viseme shapes can replace it. -->
      <g id="eyes">
        <g id="eye_l">
          <circle id="eye_l_white" cx="208" cy="213" r="1.4" fill="#3B2420"/>
          <circle id="eye_l_pupil" data-pivot="208 213" cx="208" cy="213" r="1.4" fill="#3B2420"/>
          <ellipse id="eye_l_lid" data-pivot="201 179" cx="201" cy="206" rx="34" ry="27" fill="#FCE1CD"/>
          <path id="eye_l_closed" d="M172 203 Q201 219 230 203" stroke="#2A1A16" stroke-width="3.6" fill="none" stroke-linecap="round" visibility="hidden"/>
          <path d="M172 203 L167 199" stroke="#2A1A16" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <g id="eye_r">
          <circle id="eye_r_white" cx="305" cy="213" r="1.4" fill="#3B2420"/>
          <circle id="eye_r_pupil" data-pivot="305 213" cx="305" cy="213" r="1.4" fill="#3B2420"/>
          <ellipse id="eye_r_lid" data-pivot="315 179" cx="315" cy="206" rx="34" ry="27" fill="#FCE1CD"/>
          <path id="eye_r_closed" d="M286 203 Q315 219 344 203" stroke="#2A1A16" stroke-width="3.6" fill="none" stroke-linecap="round" visibility="hidden"/>
          <path d="M344 203 L349 199" stroke="#2A1A16" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </g>
      <g id="brows">
        <path id="brow_l" data-pivot="201 165" d="M180 167 Q200 160 222 165" stroke="#4A3434" stroke-width="2" stroke-opacity="0.01" fill="none"/>
        <path id="brow_r" data-pivot="315 165" d="M294 165 Q316 160 336 167" stroke="#4A3434" stroke-width="2" stroke-opacity="0.01" fill="none"/>
      </g>
      <g id="mouth" data-pivot="256 280">
        <ellipse cx="256" cy="280" rx="39" ry="21" fill="#FCE1CD"/>
        <g id="mouth_rest" visibility="hidden"><path d="M234 274 Q256 291 278 274" stroke="#A8574E" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M233.5 273 L231.5 270.5 M278.5 273 L280.5 270.5" stroke="#A8574E" stroke-width="2" stroke-linecap="round"/></g>
        <g id="mouth_mbp" visibility="hidden"><path d="M237 276 Q256 281 275 276" stroke="#A8574E" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g id="mouth_cons" visibility="hidden"><path d="M236 273 Q256 278.5 276 273 Q272 285 256 286 Q240 285 236 273Z" fill="#FBA393" stroke="#8A4A42" stroke-width="1.5" stroke-linejoin="round"/><path d="M239 273.8 Q256 279.3 273 273.8 L272 278.3 Q256 283.8 240 278.3Z" fill="#F9F0E9"/></g>
        <g id="mouth_a" visibility="hidden"><path d="M234 272 Q256 277.5 278 272 Q274 293 256 294 Q238 293 234 272Z" fill="#FBA393" stroke="#8A4A42" stroke-width="1.5" stroke-linejoin="round"/><path d="M237 272.8 Q256 278.3 275 272.8 L274 277.3 Q256 282.8 238 277.3Z" fill="#F9F0E9"/><ellipse cx="256" cy="288" rx="7.0" ry="3.6" fill="#F58A86"/></g>
        <g id="mouth_i" visibility="hidden"><path d="M231 273 Q256 278.5 281 273 Q277 284 256 285 Q235 284 231 273Z" fill="#FBA393" stroke="#8A4A42" stroke-width="1.5" stroke-linejoin="round"/><path d="M234 273.8 Q256 279.3 278 273.8 L277 278.3 Q256 283.8 235 278.3Z" fill="#F9F0E9"/></g>
        <g id="mouth_u" visibility="hidden"><ellipse cx="256" cy="280" rx="8" ry="9.5" fill="#FBA393" stroke="#8A4A42" stroke-width="1.5"/></g>
        <g id="mouth_e" visibility="hidden"><path d="M238 272 Q256 277.5 274 272 Q270 288 256 289 Q242 288 238 272Z" fill="#FBA393" stroke="#8A4A42" stroke-width="1.5" stroke-linejoin="round"/><path d="M241 272.8 Q256 278.3 271 272.8 L270 277.3 Q256 282.8 242 277.3Z" fill="#F9F0E9"/></g>
        <g id="mouth_o" visibility="hidden"><ellipse cx="256" cy="281" rx="11" ry="13" fill="#FBA393" stroke="#8A4A42" stroke-width="1.5"/><ellipse cx="256" cy="287" rx="6" ry="4" fill="#F58A86"/></g>
        <g id="mouth_fv" visibility="hidden"><path d="M236 273 Q256 278.5 276 273 Q272 284 256 285 Q240 284 236 273Z" fill="#FBA393" stroke="#8A4A42" stroke-width="1.5" stroke-linejoin="round"/><path d="M239 273.8 Q256 279.3 273 273.8 L272 278.3 Q256 283.8 240 278.3Z" fill="#F9F0E9"/><path d="M242 284.5 Q256 291 270 284.5" stroke="#E8877E" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g id="mouth_l_th" visibility="hidden"><path d="M237 272 Q256 277.5 275 272 Q271 286 256 287 Q241 286 237 272Z" fill="#FBA393" stroke="#8A4A42" stroke-width="1.5" stroke-linejoin="round"/><path d="M240 272.8 Q256 278.3 272 272.8 L271 277.3 Q256 282.8 241 277.3Z" fill="#F9F0E9"/><ellipse cx="256" cy="281" rx="6.1" ry="3.6" fill="#F58A86"/></g>
      </g>
      <g id="expr">
        <g id="expr_neutral" visibility="hidden"><circle cx="256" cy="231" r="1" fill="#FCDCC5"/></g>
        <g id="expr_happy" visibility="hidden"><path d="M392 150 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z" fill="#FFC23D"/><path d="M120 176 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill="#FFC23D"/></g>
        <g id="expr_thinking" visibility="hidden"><circle cx="388" cy="170" r="5" fill="#FFFFFF" stroke="#E0707E" stroke-width="2"/><circle cx="404" cy="150" r="8" fill="#FFFFFF" stroke="#E0707E" stroke-width="2"/></g>
        <g id="expr_confused" visibility="hidden"><path d="M390 140 q8 -14 20 -6 q8 8 -4 16 l-2 8" stroke="#E0707E" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="404" cy="172" r="3.5" fill="#E0707E"/></g>
        <g id="expr_encouraging" visibility="hidden"><circle cx="256" cy="231" r="1" fill="#FCDCC5"/></g>
        <g id="expr_celebrating" visibility="hidden"><path d="M120 110 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6z" fill="#FFC23D"/><path d="M400 96 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5z" fill="#FFC23D"/></g>
      </g>
    </g>
  </g>
</svg>
